video_dir: data/videos
work_dir: results
offsets_s: {}
process_fps: 10
detector: {model: yolo26n.pt, imgsz: 960, conf: 0.25, openvino: true}
tracker: {track_buffer: 50, match_thresh: 0.8}
reid:
  backend: osnet
  weights: models/osnet_x0_25_msmt17.pth
  obs_per_track: 8
  min_box_h: 80
  hsv_weight: 0.5
identities:
  min_track_frames: 15
  thr: 0.70
  same_cam_penalty: 0.10
  max_gap_cross_s: 30
  reconnect_gap_s: 8
  overlap_tol_s: 1.0
events:
  min_dwell_rows: 3
  gap_tol_s: 0.6
  max_cross_s: 25
  min_cross_s: 1.0
  per_camera: true
  merge_window_s: 6.0
  verify_path: true
  min_coverage: 0.5
  max_speed_h_per_s: null
  max_jump_heights: 1.0
  cam_overrides:
    cam5:
      min_cross_s: 0.5
      path_pad_s: 1.0
      flip_window_s: 8
      min_net_dy: 0.10
  cross_camera_dedup:
    window_s: 1.0
    pairs: [[cam5, cam2]]
  local_events: true
  edge:
    enabled: true
    cams: [cam5]
    margin: 0.04
    min_rise: 0.10
    ref_s: 3.0
    min_dur_s: 1.0
    max_dur_s: 12.0
    max_backtrack: 0.04
    confirm_window_s: 6.0
groups:
  mode: crossing
  pair_gap_s: 4.0
  pair_window_s: 6.0
  max_span_s: 8.0
  prox_heights: 1.6
  min_common_frames: 25
  frac_close: 0.7
  min_move_heights: 0.5
  min_cos: 0.3
  event_window_s: 15
  max_size: 8
  camera_priority: [cam5, cam2, cam6, cam1, cam3, cam4, cam7]
  min_link_density: 0.5
  standing_min_frames: 50
  standing_prox_heights: 1.2
  standing_frac_close: 0.8
  standing_max_size: 6
render: {width: 960, crf: 30}
