# Normalised (0..1) polygons per camera (x right, y down). bottom = foot of stairs, top = head of stairs.
# bottom->top = UP, top->bottom = DOWN. FIRST-PASS values read off stills; refine with tools/annotate.py.
# cam4 and cam7 only see plaza (no stairs) -> no zones, they contribute identity matching only.
cam1:   # stairs run along the right edge, rising away from camera
  bottom: [[0.84, 0.70], [1.0, 0.70], [1.0, 1.0], [0.84, 1.0]]
  top:    [[0.90, 0.14], [1.0, 0.14], [1.0, 0.30], [0.93, 0.30]]
cam2:   # stairs upper-left, base runs diagonally
  bottom: [[0.12, 0.31], [0.42, 0.25], [0.55, 0.19], [0.55, 0.27], [0.42, 0.34], [0.12, 0.40]]
  top:    [[0.25, 0.02], [0.70, 0.01], [0.70, 0.08], [0.25, 0.10]]
